services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-blik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу контейнера не публикуем — снаружи не нужен, backend обращается к postgres
    # внутри docker-сети по имени сервиса (см. DATABASE_URL ниже). Публикация 5432:5432 на
    # проде оставляла бы Postgres доступным из интернета всем, кто пробьётся мимо Ideco.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-blik}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Явные переменные вместо env_file — при деплое из Portainer (Stacks → Repository) репозиторий
    # клонируется с нуля, и физического infra/.env там нет (он и не должен быть в git). Portainer
    # подставляет значения из своих Stack → Environment variables сюда же, через ${VAR} — тот же
    # механизм, что и для DOMAIN у caddy ниже. Для локального docker compose up из infra/ ничего
    # не меняется — тамошний infra/.env compose всё так же подхватывает сам, автоматически.
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-blik}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-blik}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      MASTER_USERNAME: ${MASTER_USERNAME}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      MASTER_FULL_NAME: ${MASTER_FULL_NAME:-Master Administrator}
      SEED_TEST_ACCOUNTS: ${SEED_TEST_ACCOUNTS:-false}
      LDAP_URL: ${LDAP_URL}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_STAFF_GROUP_DN: ${LDAP_STAFF_GROUP_DN}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_TLS_CA_PATH: ${LDAP_TLS_CA_PATH:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_VIDEO_UPLOAD_SIZE_MB: ${MAX_VIDEO_UPLOAD_SIZE_MB:-200}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    volumes:
      - uploads:/app/uploads
      # Сертификат внутреннего CA колледжа для ldaps:// (см. LDAP_TLS_CA_PATH в .env.example) —
      # публичный сертификат, не секрет, можно хранить в репозитории как есть.
      - ./certs:/certs:ro
    # Порт наружу тоже не публикуем (см. комментарий у postgres) — снаружи стоит
    # caddy->nginx, к backend напрямую с хоста ходить не нужно, а занятый на сервере
    # порт 3000 другим контейнером иначе не давал бы стеку вообще подняться.

  # Multi-stage сборка: React (vite build) -> статика, отдаваемая nginx, который также
  # проксирует /api и /socket.io на backend. Отдельный "frontend"-сервис не нужен. Порт наружу
  # не публикуем — снаружи стоит caddy (см. ниже), nginx доступен только внутри docker-сети.
  nginx:
    build:
      context: ../apps/frontend
    restart: unless-stopped
    depends_on:
      - backend

  # TLS-терминатор перед nginx — сам получает и продлевает сертификат Let's Encrypt по DOMAIN
  # (см. infra/.env.example и Caddyfile). Нужен, чтобы наружу торчал HTTPS, а не голый :80 —
  # обязательно для мини-приложения MAX и для браузерных Web Push.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:?укажите публичный домен в .env, например blik.college.ru}
    ports:
      - '80:80'
      - '443:443'
    # Caddyfile пишется прямо внутри контейнера при старте, не монтируется с хоста. И bind-mount
    # (./Caddyfile:/etc/caddy/Caddyfile), и compose `configs:` (для обычного docker compose, не
    # Swarm, реализован под капотом тем же bind-mount'ом) на Portainer-деплое из git-репозитория
    # одинаково не находили файл на хосте после клонирования, хотя он в репозитории точно есть —
    # со стороны Portainer причину выяснить не удалось, поэтому просто убрали зависимость от файла
    # на хосте целиком. `{$DOMAIN}` внутри — не shell-переменная (heredoc с 'CADDYFILE' в кавычках,
    # без раскрытия), это синтаксис самого Caddy — он подставит его сам из своего DOMAIN ниже,
    # так же, как раньше при чтении смонтированного файла.
    command:
      - sh
      - -c
      - |
        cat <<'CADDYFILE' > /etc/caddy/Caddyfile
        {$$DOMAIN} {
            reverse_proxy nginx:80
        }
        CADDYFILE
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
