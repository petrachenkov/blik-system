services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-blik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-blik}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blik}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-blik}?schema=public
    volumes:
      - uploads:/app/uploads
    ports:
      - '3000:3000'

  # Multi-stage сборка: React (vite build) -> статика, отдаваемая nginx, который также
  # проксирует /api и /socket.io на backend. Отдельный "frontend"-сервис не нужен.
  nginx:
    build:
      context: ../apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata:
  uploads:
